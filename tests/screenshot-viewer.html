<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="preload" href="Montserrat-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="Montserrat-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../demo/topola.css"/>
    <style>
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 400;
        src: url('Montserrat-Regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 700;
        src: url('Montserrat-Bold.woff2') format('woff2');
      }
      text {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }
    </style>
    <script src="../demo/bundle.js"></script>
  </head>
  <body>
    <svg class="graph" id="chart"></svg>
    <script>
      async function renderChart(scenario) {
        const svgEl = document.getElementById('chart');
        svgEl.innerHTML = '';

        const res = await fetch(scenario.dataUrl);
        const model = scenario.isGedcom
          ? topola.gedcomToModel(await res.text())
          : await res.json();

        const graph = topola.createModelGraph(model);
        const startIndi = scenario.startIndi || model.indis[0].id;

        let config;
        if (scenario.preset === 'fancy') {
          config = topola.createFancyConfig({ model: graph });
        } else {
          const nodePlugin =
            scenario.preset === 'simple'
              ? topola.createSimpleNodePlugin({ model: graph })
              : scenario.preset === 'circle'
                ? topola.createCircleNodePlugin({ model: graph })
                : topola.createDetailedNodePlugin({ model: graph, locale: 'en' });

          const schemes = [];
          if (scenario.scheme === 'sex') {
            schemes.push(topola.sexScheme(graph));
          } else if (scenario.scheme === 'generation') {
            schemes.push(topola.generationScheme());
          }

          config = {
            graph,
            chart: scenario.chart,
            direction: scenario.direction || 'down',
            maxAncestorGenerations: scenario.maxAncestorGenerations,
            maxDescendantGenerations: scenario.maxDescendantGenerations,
            nodePlugin,
            schemes,
            theme: scenario.colorTarget ? { colorTarget: scenario.colorTarget } : undefined,
          };
        }

        const chart = topola.createChart({ svg: '#chart', config });
        chart.update({ startIndi });
      }

      window.renderChart = renderChart;
    </script>
  </body>
</html>
