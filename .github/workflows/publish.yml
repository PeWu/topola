name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g. next, latest, v3)'
        required: true
        default: 'latest'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: npm publish --tag "$NPM_TAG"
